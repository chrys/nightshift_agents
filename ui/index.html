<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nightly Prompts Cockpit</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body class="h-full flex flex-col bg-dark-900 text-dark-100 overflow-hidden">
  <!-- Top Titlebar / Global Header -->
  <header class="titlebar-drag h-12 bg-dark-800 border-b border-dark-600 flex items-center justify-between px-4 pl-20 select-none">
    <div class="flex items-center space-x-3">
      <span class="text-lg">🌙</span>
      <h1 class="text-sm font-semibold tracking-wide text-dark-50">Nightly Prompts Cockpit</h1>
      <span id="persona-badge" class="hidden md:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-dark-700 text-dark-100 border border-dark-600">
        <!-- Injected via TS -->
      </span>
    </div>

    <div class="titlebar-no-drag flex items-center space-x-3">
      <button id="btn-run-all" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium bg-brand-500 hover:bg-brand-600 text-white transition-colors shadow-sm">
        <span>⚡</span>
        <span>Run All Repos</span>
      </button>
    </div>
  </header>

  <!-- App Workspace (Sidebar + Main Cockpit) -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-72 bg-dark-800 border-r border-dark-600 flex flex-col justify-between">
      <!-- Top: Project List -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <div class="p-3 border-b border-dark-600 flex items-center justify-between">
          <span class="text-xs font-semibold text-dark-50 uppercase tracking-wider">Tracked Projects</span>
          <button id="btn-add-project" class="p-1 rounded hover:bg-dark-700 text-dark-100 hover:text-white transition-colors" title="Add Project">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
          </button>
        </div>

        <div id="project-list" class="flex-1 overflow-y-auto p-2 space-y-1">
          <!-- Injected dynamically -->
        </div>
      </div>

      <!-- Bottom: System Schedule & Status -->
      <div class="p-3 border-t border-dark-600 bg-dark-800">
        <div id="schedule-card" class="bg-dark-700 p-2.5 rounded-lg border border-dark-600 text-xs">
          <!-- Injected dynamically -->
        </div>
      </div>
    </aside>

    <!-- Main Detail Cockpit -->
    <main id="main-content" class="flex-1 flex flex-col bg-dark-900 overflow-hidden">
      <!-- Project Header & Controls -->
      <div id="project-header" class="p-5 border-b border-dark-600 bg-dark-800 flex items-center justify-between">
        <div class="space-y-1">
          <div class="flex items-center space-x-3">
            <h2 id="current-project-name" class="text-lg font-bold text-dark-50">Select a Project</h2>
            <span id="current-project-engine" class="px-2 py-0.5 rounded text-xs font-medium bg-dark-700 text-dark-100 border border-dark-600">agy</span>
            <span id="current-project-branch" class="px-2 py-0.5 rounded text-xs font-medium bg-dark-700 text-blue-400 border border-dark-600">main</span>
          </div>
          <p id="current-project-path" class="text-xs text-dark-500 font-mono truncate max-w-xl"></p>
        </div>

        <div class="flex items-center space-x-3">
          <button id="btn-run-single" class="flex items-center space-x-2 px-4 py-2 rounded-md text-sm font-semibold bg-brand-500 hover:bg-brand-600 text-white transition-colors shadow">
            <span>🚀</span>
            <span id="btn-run-single-text">Run Sweep Now</span>
          </button>
        </div>
      </div>

      <!-- Cockpit Tabs -->
      <div class="flex border-b border-dark-600 bg-dark-800 px-5 space-x-6 text-sm">
        <button class="cockpit-tab py-2.5 font-medium border-b-2 border-brand-500 text-white transition-colors" data-tab="overview">
          📊 PR Activity
        </button>
        <button class="cockpit-tab py-2.5 font-medium border-b-2 border-transparent text-dark-500 hover:text-dark-100 transition-colors" data-tab="tasks">
          📝 Tasks
        </button>
        <button class="cockpit-tab py-2.5 font-medium border-b-2 border-transparent text-dark-500 hover:text-dark-100 transition-colors" data-tab="rules">
          🛡️ Rules
        </button>
        <button class="cockpit-tab py-2.5 font-medium border-b-2 border-transparent text-dark-500 hover:text-dark-100 transition-colors" data-tab="logs">
          📜 Logs & Live Terminal
        </button>
        <button class="cockpit-tab py-2.5 font-medium border-b-2 border-transparent text-dark-500 hover:text-dark-100 transition-colors" data-tab="settings">
          ⚙️ Configuration
        </button>
      </div>

      <!-- Tab Content Area -->
      <div id="tab-content" class="flex-1 overflow-y-auto p-6">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Modal: Add Project -->
  <div id="modal-add-project" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-dark-800 border border-dark-600 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-dark-600 pb-3">
        <h3 class="text-base font-semibold text-white">Add Git Repository</h3>
        <button id="btn-close-modal" class="text-dark-500 hover:text-white">&times;</button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-medium text-dark-50 mb-1">Local Repository Path</label>
          <div class="flex space-x-2">
            <input type="text" id="input-repo-path" placeholder="/path/to/my-repo" class="flex-1 bg-dark-900 border border-dark-600 rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500 font-mono" />
            <button id="btn-browse-folder" class="px-3 py-1.5 bg-dark-700 hover:bg-dark-600 rounded-md text-xs font-medium text-white transition-colors">Browse</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-dark-50 mb-1">Target Base Branch (Optional)</label>
          <input type="text" id="input-repo-branch" placeholder="e.g. main or develop (leave blank to auto-detect)" class="w-full bg-dark-900 border border-dark-600 rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500 font-mono" />
        </div>

        <div>
          <label class="block text-xs font-medium text-dark-50 mb-1">AI Engine Override (Optional)</label>
          <select id="select-repo-engine" class="w-full bg-dark-900 border border-dark-600 rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500">
            <option value="">Use Global Default</option>
            <option value="agy">Antigravity (agy)</option>
            <option value="claude">Claude Code (claude)</option>
            <option value="opencode">OpenCode (opencode)</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end space-x-3 pt-3 border-t border-dark-600">
        <button id="btn-cancel-add" class="px-4 py-2 rounded-md text-xs font-medium bg-dark-700 hover:bg-dark-600 text-white">Cancel</button>
        <button id="btn-confirm-add" class="px-4 py-2 rounded-md text-xs font-semibold bg-brand-500 hover:bg-brand-600 text-white">Add Project</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
